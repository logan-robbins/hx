[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-harness"
version = "0.1.0"
description = "HarnessAgent Runtime: Claude Code fleet control plane (spec/HARNESS_SPEC.md)"
requires-python = ">=3.14"
# Episode memory (docs/memory.md): the local embedding store `hx memory` indexes into.
# Its default embedding function is an ONNX all-MiniLM-L6-v2 cached under ~/.cache/chroma;
# Legacy episodes remain until cutover. Planned semantic selection calls Jev through httpx;
# it does not load an embedding model or switch the executor model.
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28,<1",
]

[project.scripts]
hx = "hx.cli:main"
hx-hook = "hx.hooks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hx = ["skeleton/**/*", "skills/**/*", "ui/static/**/*", "packaging/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
