[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-harness"
version = "1.0.0"
description = "Dependency packet planning, isolated native execution, and verified software delivery"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
]

[project.scripts]
hx = "hx.cli:main"
hx-hook = "hx.hooks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hx = ["skeleton/**/*", "skills/**/*", "ui/static/**/*"]

[project.optional-dependencies]
# `pip install -e ".[test]"`: the runner and the worker plugin that spreads the suite over
# every core. Every test owns its scratch instance, HOME and tmux socket, so the lanes are
# process-parallel; `-n auto` below is what CI and the milestone script run with.
test = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
