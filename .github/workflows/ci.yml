name: ci

# hx is stdlib-only Python 3.14 that drives real tmux sessions and ships as a uv tool, so CI
# is deliberately plain: a real interpreter, a real tmux, a real uv, and pytest over the whole
# suite with every test required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests are speculative; pushed and dispatched source snapshots finish.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # One .venv on the runner's interpreter: pytest, and hx installed editable.
      - name: Create the virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[test]"

      - name: Show tool versions
        run: |
          tmux -V
          git --version
          uv --version
          .venv/bin/python --version

      # Every test is required, tests/guard included.
      - name: Full suite
        run: .venv/bin/python -m pytest -q

  package:
    needs: test
    name: wheel builds, installs, deploys, and creates an instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The same two scripts a human runs before a release. e2e-install proves the wheel
      # builds, installs, and can create a skeleton; e2e-deploy goes the whole way — the full
      # hx install, the exit-4 seed stop, the token never reaching argv or an agent home, and
      # a launch — in a HOME that did not exist a moment ago.
      - name: End-to-end install (packaging/e2e-install.sh)
        id: install-proof
        run: packaging/e2e-install.sh "$RUNNER_TEMP/e2e"

      - name: End-to-end deploy (packaging/e2e-deploy.sh)
        id: deploy-proof
        run: packaging/e2e-deploy.sh "$RUNNER_TEMP/deploy"

      # Setup creates no product checkout or OS service units. The installed deploy proof
      # then indexes source and exercises packet admission and private native execution.

      - name: Collect the wheel
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/e2e/dist/"*.whl "$RUNNER_TEMP/e2e/dist/"*.tar.gz dist/
          ls -l dist

      - name: Record the exact tested artifact manifest
        env:
          HX_SOURCE_COMMIT: ${{ github.sha }}
          HX_FULL_TESTS: ${{ needs.test.result }}
          HX_INSTALL_PROOF: ${{ steps.install-proof.outcome }}
          HX_DEPLOY_PROOF: ${{ steps.deploy-proof.outcome }}
        run: |
          PYTHONPATH=src python -m hx.ci_manifest --repo . --expected-head "$HX_SOURCE_COMMIT" \
            --artifact "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --check "required-full-suite=$HX_FULL_TESTS" \
            --check "e2e-install=$HX_INSTALL_PROOF" --check "e2e-deploy=$HX_DEPLOY_PROOF" \
            --out dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
