name: ci

# hx is stdlib-only Python 3.14 that drives real tmux sessions and ships as a uv tool, so CI
# is deliberately plain: a real interpreter, a real tmux, a real uv, and the same
# tools/milestone-check.sh every lane runs locally before finishing a goal.
#
# The guard test tests/guard/test_user_home_untouched.py compares ~/.claude against a manifest
# recorded before the build started. A runner has no such history, so each job records its own
# .baseline/ from the runner's empty HOME/.claude before any test runs. The assertion is
# therefore the real one: nothing in the suite wrote to the Claude home it was given.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # ORCHESTRATION.md "Python environment": one shared .venv on the system interpreter,
      # pytest, and hx installed editable. tools/milestone-check.sh expects .venv/bin/python.
      - name: Create the shared virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pip install -e .

      - name: Show tool versions
        run: |
          tmux -V
          git --version
          uv --version
          .venv/bin/python --version

      # The guard baseline: the runner's own Claude home, hashed before anything runs. It does
      # not exist on a fresh runner, so it is created empty — if the suite writes so much as a
      # settings file into it, test_user_home_untouched fails. .baseline/ is gitignored
      # precisely so a developer's local manifest is never what CI checks against.
      - name: Record .baseline/ from the runner's empty HOME/.claude
        run: |
          mkdir -p "$HOME/.claude" .baseline
          tools/claude-home-hash.sh "$HOME/.claude" > .baseline/claude-home.manifest
          shasum -a 256 .baseline/claude-home.manifest | cut -d' ' -f1 > .baseline/claude-home.sha256
          echo "baseline entries: $(wc -l < .baseline/claude-home.manifest)"

      # Guard tests first and on their own, so a guard failure is never buried in suite output.
      - name: Guard tests
        run: .venv/bin/python -m pytest tests/guard -q

      # Plain pytest rather than `tools/milestone-check.sh`. That script takes a lane name
      # and treats the other lanes as advisory, which is right for a lane finishing a goal and
      # wrong for CI, where every test is required. Its no-lane form now means "everything
      # required" and would be safe — but CI stating the requirement itself, rather than
      # inheriting it from a script whose default has already changed once, is the point.
      - name: Full suite (every lane's tests are required here)
        run: .venv/bin/python -m pytest -q

      - name: The suite left the runner's Claude home untouched
        run: |
          tools/claude-home-hash.sh "$HOME/.claude" > /tmp/claude-home.after
          diff -u .baseline/claude-home.manifest /tmp/claude-home.after

  package:
    name: wheel builds, installs, deploys, and creates an instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The same two scripts a human runs before a release. e2e-install proves the wheel
      # builds, installs, and can create a skeleton; e2e-deploy goes the whole way — the full
      # hx install, the exit-4 seed stop, the token never reaching argv or an agent home, and
      # a launch — in a HOME that did not exist a moment ago.
      - name: End-to-end install (packaging/e2e-install.sh)
        run: packaging/e2e-install.sh "$RUNNER_TEMP/e2e"

      - name: End-to-end deploy (packaging/e2e-deploy.sh)
        run: packaging/e2e-deploy.sh "$RUNNER_TEMP/deploy"

      # There is no `systemd accepts the rendered units` step any more: spec 14 D25 cut the
      # shipped launchd plists and systemd units, and 17.2 says "hx ships no launchd plist and
      # no systemd unit". Keeping hx running is the operator's cron. e2e-deploy asserts the
      # absence — step 12, "hx creates no repository, no worktree, and no unit files".

      - name: Collect the wheel
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/e2e/dist/"*.whl "$RUNNER_TEMP/e2e/dist/"*.tar.gz dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
