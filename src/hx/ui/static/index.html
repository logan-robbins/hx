<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>hx</title>
    <!-- No token in any URL and none in this page: GET / sets an HttpOnly cookie
         and the browser carries it on the stylesheet, the script, every fetch and
         the event stream. app.js cannot read it. -->
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-icon">h<span>↗</span></span
        >hx<span class="version">01</span></a
      >
      <div class="workspace-label">INSTANCE</div>
      <div class="workspace-name">
        <span class="workspace-icon">◈</span
        ><span id="workspace-name">hx</span>
      </div>
      <nav aria-label="Instance navigation">
        <a class="nav-link selected" href="#overview" data-nav="overview"
          ><span data-icon="graph"></span>All Pods</a
        >
      </nav>
      <div class="workspace-label pillar-label">PODS</div>
      <nav id="pod-nav" aria-label="Pod hierarchy"></nav>
      <details class="workspace-tools" open>
        <summary>Across pods</summary>
        <nav aria-label="Instance views">
          <a class="nav-link" href="#board" data-nav="board"
            ><span data-icon="board"></span>Task board</a
          ><a class="nav-link" href="#agents" data-nav="agents"
            ><span data-icon="agents"></span>Harness Agents</a
          ><a class="nav-link" href="#activity" data-nav="activity"
            ><span data-icon="activity"></span>Activity</a
          ><a class="nav-link" href="#orders" data-nav="orders"
            ><span data-icon="file"></span>Goals</a
          ><a class="nav-link" href="#archive" data-nav="archive"
            ><span data-icon="inbox"></span>Archive</a
          >
        </nav>
      </details>
      <div class="sidebar-bottom">
        <a class="nav-link" href="#partner" data-nav="partner"
          ><span data-icon="terminal"></span>Partner chat</a
        >
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
          <a href="#overview">All Pods</a>
        </nav>
        <div class="topbar-right">
          <span id="connection" class="connection"
            ><span class="dot"></span>Connecting</span
          ><button
            class="icon-button"
            id="refresh"
            aria-label="Re-read the instance"
            title="Re-read the instance"
            data-icon="refresh"
          ></button
          ><span class="operator-avatar" title="Observer view">HX</span>
        </div>
      </header>
      <div id="error-banner" class="error-banner" role="status" hidden></div>
      <main id="content" tabindex="-1">
        <div class="loading">
          <span class="loader"></span>Reading the instance…
        </div>
      </main>
      <footer class="footer">
        <span id="footer-info">Observing HARNESS_ROOT</span
        ><span>The UI observes. The Partner operates.</span>
      </footer>
    </div>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside
      id="drawer"
      class="drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Harness Agent details"
      hidden
    ></aside>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
